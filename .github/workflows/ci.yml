name: Compute simulator checks

on:
  push:
    branches: [master, "feature/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke benchmark
        run: PYTHONPATH=src python -m ecodispatch_compute --requests 100 --seeds 2 --seed 42 --json /tmp/compute-smoke.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser simulator unit tests (Node.js)
        run: node --test web/tests/*.test.mjs
      - name: Web syntax validation
        run: |
          node --check web/simulator.mjs
          node --check web/app.mjs
          node --check web/worker.mjs
          node --check web/wiki.mjs
          node --check web/wiki-data.mjs
          node --check web/validation.mjs
          node --check web/validation-worker.mjs
          node --check web/validation-app.mjs
          node --check scripts/validate-v0.4.mjs

  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frozen reserved-scenario benchmark
        run: node scripts/validate-v0.4.mjs --stage reserved --scenario stressed --output results/validation-v0.4-reserved-stressed.json
      - name: Upload machine-readable reserved analysis
        uses: actions/upload-artifact@v4
        with:
          name: validation-v0.4-reserved-stressed
          path: results/validation-v0.4-reserved-stressed.json
          retention-days: 90

  exploration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All four fixed exploratory scenarios
        run: node scripts/validate-v0.4.mjs --stage exploration --output results/validation-v0.4-exploration.json
      - name: Upload exploratory report
        uses: actions/upload-artifact@v4
        with:
          name: validation-v0.4-exploration
          path: results/validation-v0.4-exploration.json
          retention-days: 90
